version: 2 
filters: 
  ".irssi/config": 
    rules: 
      nickname: 
        description: IRC nickname 
        regex: nick(\s*)=(\s*)(?#QuotedString); 
        substitute: nick\1=\2"(?#Key)"; 
      realname: 
        description: IRC real name 
        regex: real_name(\s*)=(\s*)(?#QuotedString); 
        substitute: real_name\1=\2"(?#Key)"; 
      username: 
        description: IRC user name 
        regex: user_name(\s*)=(\s*)(?#QuotedString); 
        substitute: user_name\1=\2"(?#Key)"; 
      password: 
        description: NickServ IDENTIFY password 
        regex: (/msg\s+NickServ\s+IDENTIFY\s+)([^;\s"]+) 
        substitute: \1(?#Key) 
      sasl_username:
        description: IRC SASL username
        regex: sasl_username(\s*)=(\s*)(?#QuotedString);
        substitute: sasl_username\1=\2"(?#Key)";
      sasl_password:
        description: IRC SASL password
        regex: sasl_password(\s*)=(\s*)(?#QuotedString);
        substitute: sasl_password\1=\2"(?#Key)";
