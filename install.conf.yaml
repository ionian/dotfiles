- defaults:
    link:
      create: true
      relink: true

- clean: ['~']

- link:
    ~/.Xresources: .Xresources
    ~/.bashrc: .bashrc
    ~/.colors: .colors
    ~/.dir_colors: .dir_colors
    ~/.gitconfig: .gitconfig
    ~/.gitignore: .gitignore
    ~/.gitmodules: .gitmodules
    ~/.irssi/config: .irssi/config
    ~/.urxvt/ext/font-size: .urxvt/ext/font-size
    ~/.vimrc: .vimrc
    ~/.vim: .vim
    ~/.xinitrc: .xinitrc

- shell:
        - [git submodule update --init --recursive, Installing submodules]
